<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiles Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  body {
    background: #0a0a0f;
    color: #e6e6e6;
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 40px 24px;
    min-height: 100vh;
  }
  .input-wrap {
    max-width: 900px;
    margin: 0 auto 48px;
  }
  .input-wrap label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8b8b9a;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .input-wrap input {
    width: 100%;
    background: #15151f;
    border: 1px solid rgba(255,255,255,0.16);
    color: #e6e6e6;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    padding: 14px 18px;
    border-radius: 8px;
    outline: none;
  }
  .input-wrap input:focus { border-color: #ffb000; }

  .tile-heading {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 4px;
    max-width: 900px;
    margin: 0 auto;
    line-height: 1;
  }
  .tile-word {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-right: 12px;
  }
  .tile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    border-radius: 2px;
    transition: transform 0.15s ease;
  }
  .tile:hover {
    transform: scale(1.05) !important;
    z-index: 2;
  }

  .hint {
    max-width: 900px;
    margin: 48px auto 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #55555f;
    text-align: center;
  }
</style>
</head>
<body>

<div class="input-wrap">
  <label>&gt; type a title</label>
  <input id="titleInput" type="text" value="Making and mending" autofocus>
</div>

<h1 class="tile-heading" id="tileHeading"></h1>

<p class="hint">Every letter gets random color, font, size, and position. Refresh to shuffle.</p>

<script>
  const TILE_COLORS = [
    '#5fa8d3', '#2d5a3d', '#6ba8c9', '#a8c96a',
    '#b3b94d', '#4a90a4', '#c4d68f', '#5a6b9a',
    '#2c4a6b', '#8db850', '#3d6b8e', '#4a6b9e'
  ];

  const TILE_FONTS = [
    { family: "'JetBrains Mono', monospace", weight: 500, style: 'normal' },
    { family: "'JetBrains Mono', monospace", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 500, style: 'italic' },
    { family: "Inter, sans-serif", weight: 900, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'italic' },
    { family: "Georgia, serif", weight: 700, style: 'normal' },
    { family: "'Times New Roman', serif", weight: 400, style: 'italic' },
    { family: "Garamond, Georgia, serif", weight: 500, style: 'normal' },
    { family: "'Courier New', monospace", weight: 700, style: 'normal' }
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function textColorFor(bg) {
    const r = parseInt(bg.slice(1, 3), 16);
    const g = parseInt(bg.slice(3, 5), 16);
    const b = parseInt(bg.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#0a0a0a' : '#f2f2f2';
  }

  function renderTiles(text) {
    const heading = document.getElementById('tileHeading');
    if (!text.trim()) { heading.innerHTML = ''; return; }

    const words = text.split(' ').filter(w => w.length > 0);
    let html = '';

    words.forEach(word => {
      html += '<span class="tile-word">';
      for (const ch of word) {
        const bg = pick(TILE_COLORS);
        const fg = textColorFor(bg);
        const font = pick(TILE_FONTS);
        const size = 22 + Math.floor(Math.random() * 30);      // 22–52
        const padX = 8 + Math.floor(Math.random() * 16);        // 8–24
        const padY = 4 + Math.floor(Math.random() * 14);        // 4–18
        const dy = -10 + Math.floor(Math.random() * 21);        // -10 to +10
        const rot = -3 + Math.random() * 6;                     // -3 to +3
        html += `<span class="tile" style="
          background:${bg};
          color:${fg};
          font-family:${font.family};
          font-weight:${font.weight};
          font-style:${font.style};
          font-size:${size}px;
          padding:${padY}px ${padX}px;
          transform: translateY(${dy}px) rotate(${rot}deg);
        ">${ch}</span>`;
      }
      html += '</span>';
    });

    heading.innerHTML = html;
  }

  const input = document.getElementById('titleInput');
  input.addEventListener('input', () => renderTiles(input.value));

  // initial render
  renderTiles(input.value);

  // press space to shuffle (fun for testing)
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') renderTiles(input.value);
  });
</script>

</body>
</html>
