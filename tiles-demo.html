<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiles Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/w95fa" rel="stylesheet">
<style>
  body {
    background: #0a0a0f;
    color: #e6e6e6;
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 40px 24px;
    min-height: 100vh;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  .input-wrap { margin-bottom: 40px; }
  .input-wrap label, .body-wrap label, .picture-wrap label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8b8b9a;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .input-wrap input {
    width: 100%;
    background: #15151f;
    border: 1px solid rgba(255,255,255,0.16);
    color: #e6e6e6;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    padding: 14px 18px;
    border-radius: 8px;
    outline: none;
    box-sizing: border-box;
  }
  .input-wrap input:focus { border-color: #ffb000; }

  .tile-heading {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px 0;
    margin: 0 0 48px;
    line-height: 1;
  }
  .tile-word {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-right: 32px;
  }
  .tile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    border-radius: 2px;
    transition: transform 0.15s ease;
  }
  .tile:hover { transform: scale(1.05) !important; z-index: 2; }

  .picture-wrap { margin: 32px 0; }
  .picture-drop {
    border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    background: rgba(255,255,255,0.01);
  }
  .picture-drop:hover {
    border-color: #ffb000;
    background: rgba(255,176,0,0.03);
  }
  .picture-drop .icon {
    font-size: 28px;
    color: #55555f;
    margin-bottom: 8px;
  }
  .picture-drop .text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #8b8b9a;
  }
  .picture-drop input[type="file"] { display: none; }

  .picture-preview {
    width: 100%;
    border-radius: 8px;
    display: none;
    margin-top: 12px;
  }
  .picture-preview.show { display: block; }

  .body-wrap { margin-top: 12px; }
  .body-wrap textarea {
    width: 100%;
    min-height: 400px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 8px;
    color: #e6e6e6;
    font-family: 'W95FA', 'VT323', monospace;
    font-size: 16px;
    line-height: 1.85;
    padding: 28px 32px;
    outline: none;
    resize: vertical;
    box-sizing: border-box;
    letter-spacing: 0.02em;
  }
  .body-wrap textarea:focus { border-color: rgba(255,255,255,0.2); }
  .body-wrap textarea::placeholder { color: #55555f; }

  .hint {
    margin: 40px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #55555f;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">

  <div class="input-wrap">
    <label>&gt; type a title</label>
    <input id="titleInput" type="text" value="Making and mending">
  </div>

  <h1 class="tile-heading" id="tileHeading"></h1>

  <!-- PICTURE SECTION -->
  <div class="picture-wrap">
    <label>&gt; add a picture (optional)</label>
    <div class="picture-drop" id="pictureDrop">
      <div class="icon">+</div>
      <div class="text">click to upload an image</div>
      <input type="file" id="pictureInput" accept="image/*">
    </div>
    <img class="picture-preview" id="picturePreview" alt="preview">
  </div>

  <div class="body-wrap">
    <label>&gt; write your transmission</label>
    <textarea id="bodyInput" placeholder="Start writing here...">This month, I started two projects that I've been thinking about for a while. For the first, I built something completely new to me, and for the second, I repaired something old.

One of my favorite tapes is Sounds of Summer: Field Recordings of Solar Electronics by my friend Max Hamel. Their handmade synthesizers respond to the level of sunlight over two fifteen-minute recordings, set within the ambient sounds of the city.</textarea>
  </div>

  <p class="hint">Picture sits between the title and the body. Full width. Like The Moss.</p>

</div>

<script>
  const TILE_COLORS = [
    '#5fa8d3', '#2d5a3d', '#6ba8c9', '#a8c96a',
    '#b3b94d', '#4a90a4', '#c4d68f', '#5a6b9a',
    '#2c4a6b', '#8db850', '#3d6b8e', '#4a6b9e'
  ];

  const TILE_FONTS = [
    { family: "'JetBrains Mono', monospace", weight: 500, style: 'normal' },
    { family: "'JetBrains Mono', monospace", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 500, style: 'italic' },
    { family: "Inter, sans-serif", weight: 900, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'italic' },
    { family: "Georgia, serif", weight: 700, style: 'normal' },
    { family: "'Times New Roman', serif", weight: 400, style: 'italic' },
    { family: "Garamond, Georgia, serif", weight: 500, style: 'normal' },
    { family: "'Courier New', monospace", weight: 700, style: 'normal' }
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function textColorFor(bg) {
    const r = parseInt(bg.slice(1, 3), 16);
    const g = parseInt(bg.slice(3, 5), 16);
    const b = parseInt(bg.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#0a0a0a' : '#f2f2f2';
  }

  function renderTiles(text) {
    const heading = document.getElementById('tileHeading');
    if (!text.trim()) { heading.innerHTML = ''; return; }

    const words = text.split(' ').filter(w => w.length > 0);
    let html = '';

    words.forEach(word => {
      html += '<span class="tile-word">';
      for (const ch of word) {
        const bg = pick(TILE_COLORS);
        const fg = textColorFor(bg);
        const font = pick(TILE_FONTS);
        const size = 22 + Math.floor(Math.random() * 30);
        const padX = 8 + Math.floor(Math.random() * 16);
        const padY = 4 + Math.floor(Math.random() * 14);
        const dy = -10 + Math.floor(Math.random() * 21);
        const rot = -3 + Math.random() * 6;
        html += `<span class="tile" style="
          background:${bg};
          color:${fg};
          font-family:${font.family};
          font-weight:${font.weight};
          font-style:${font.style};
          font-size:${size}px;
          padding:${padY}px ${padX}px;
          transform: translateY(${dy}px) rotate(${rot}deg);
        ">${ch}</span>`;
      }
      html += '</span>';
    });

    heading.innerHTML = html;
  }

  const input = document.getElementById('titleInput');
  input.addEventListener('input', () => renderTiles(input.value));
  renderTiles(input.value);

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement === input) {
      renderTiles(input.value);
    }
  });

  // Picture upload
  const pictureDrop = document.getElementById('pictureDrop');
  const pictureInput = document.getElementById('pictureInput');
  const picturePreview = document.getElementById('picturePreview');

  pictureDrop.addEventListener('click', () => pictureInput.click());

  pictureInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      picturePreview.src = ev.target.result;
      picturePreview.classList.add('show');
      pictureDrop.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });
</script>

</body>
</html>
