<style>
  .mylores-wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  /* Header row: title on left, button on right */
  .mylores-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin: 48px 0 32px;
    padding: 0 24px;
  }
  .mylores-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text);
  }
  .submit-lore-btn {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 12px 22px;
    border: 1px solid #ffb000;
    color: #ffb000;
    background: rgba(255,176,0,0.08);
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .submit-lore-btn:hover {
    background: rgba(255,176,0,0.16);
    text-decoration: none;
  }

  /* Card list */
  .mylores-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 0 24px 48px;
  }

  .ml-card {
    position: relative;
    border: 1px solid rgba(255,255,255,0.14);
    border-left: 3px solid #ffb000;
    border-radius: 10px;
    padding: 22px 24px 20px;
    background: rgba(255,255,255,0.01);
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.15s ease;
  }
  .ml-card:hover {
    border-color: rgba(255,255,255,0.24);
    border-left-color: #ffb000;
  }
  .ml-card.approved { border-left-color: #00ff88; }
  .ml-card.rejected { border-left-color: #ff4444; }

  .ml-tiles {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 0;
    line-height: 1;
  }
  .ml-tiles .tile-word {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-right: 12px;
  }
  .ml-tiles .tile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    border-radius: 2px;
  }

  .ml-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8b8b9a;
    letter-spacing: 0.05em;
  }
  .ml-meta .dot {
    width: 3px;
    height: 3px;
    background: #55555f;
    border-radius: 50%;
  }

  .ml-status {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 3px 9px;
    border-radius: 4px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .ml-status.pending { color: #ffb000; border: 1px solid #ffb000; background: rgba(255,176,0,0.08); }
  .ml-status.approved { color: #00ff88; border: 1px solid #00ff88; background: rgba(0,255,136,0.06); }
  .ml-status.rejected { color: #ff4444; border: 1px solid #ff4444; background: rgba(255,68,68,0.06); }

  .ml-blurb {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #a8a8b8;
    line-height: 1.6;
  }

  .ml-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .ml-open {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #ffb000;
    text-decoration: none;
  }
  .ml-open:hover { text-decoration: underline; }

  .ml-delete {
    background: transparent;
    border: 1px solid rgba(255,68,68,0.5);
    color: #ff4444;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    margin-left: auto;
  }
  .ml-delete:hover {
    border-color: #ff4444;
    background: rgba(255,68,68,0.1);
  }
  .ml-delete:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .ml-empty {
    text-align: center;
    padding: 60px 24px;
    color: #8b8b9a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 10px;
    line-height: 1.9;
  }

  .gate {
    text-align: center;
    padding: 80px 24px;
    color: #8b8b9a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    line-height: 1.8;
  }

  @media (max-width: 600px) {
    .mylores-header {
      padding: 0 20px;
      margin: 32px 0 24px;
    }
    .mylores-list { padding: 0 20px 32px; }
    .ml-card { padding: 18px 18px 16px; }
    .submit-lore-btn {
      font-size: 12px;
      padding: 10px 16px;
    }
  }
</style>
<!-- architect: 29 -->

<script>
  const TILE_COLORS = [
    '#5fa8d3', '#2d5a3d', '#6ba8c9', '#a8c96a',
    '#b3b94d', '#4a90a4', '#c4d68f', '#5a6b9a',
    '#2c4a6b', '#8db850', '#3d6b8e', '#4a6b9e'
  ];

  const TILE_FONTS = [
    { family: "'JetBrains Mono', monospace", weight: 500, style: 'normal' },
    { family: "'JetBrains Mono', monospace", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 500, style: 'italic' },
    { family: "Inter, sans-serif", weight: 900, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'italic' },
    { family: "Georgia, serif", weight: 700, style: 'normal' },
    { family: "'Times New Roman', serif", weight: 400, style: 'italic' },
    { family: "Garamond, Georgia, serif", weight: 500, style: 'normal' },
    { family: "'Courier New', monospace", weight: 700, style: 'normal' }
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function textColorFor(bg) {
    const r = parseInt(bg.slice(1, 3), 16);
    const g = parseInt(bg.slice(3, 5), 16);
    const b = parseInt(bg.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#0a0a0a' : '#f2f2f2';
  }

  function renderTilesInto(container, text, minSize, maxSize) {
    if (!text || !text.trim()) { container.innerHTML = ''; return; }
    const words = text.split(' ').filter(w => w.length > 0);
    let html = '';
    words.forEach(word => {
      html += '<span class="tile-word">';
      for (const ch of word) {
        const bg = pick(TILE_COLORS);
        const fg = textColorFor(bg);
        const font = pick(TILE_FONTS);
        const size = minSize + Math.floor(Math.random() * (maxSize - minSize));
        const scale = minSize / 22;
        const padX = Math.round((8 + Math.floor(Math.random() * 16)) * scale);
        const padY = Math.round((4 + Math.floor(Math.random() * 14)) * scale);
        const dy = -6 + Math.floor(Math.random() * 13);
        const rot = -2 + Math.random() * 4;
        html += `<span class="tile" style="
          background:${bg};
          color:${fg};
          font-family:${font.family};
          font-weight:${font.weight};
          font-style:${font.style};
          font-size:${size}px;
          padding:${padY}px ${padX}px;
          transform: translateY(${dy}px) rotate(${rot}deg);
        ">${ch}</span>`;
      }
      html += '</span>';
    });
    container.innerHTML = html;
  }

  function ts(v) {
    if (!v) return 0;
    if (typeof v === 'number') return v;
    if (v.toMillis) return v.toMillis();
    return 0;
  }

  function escapeHTML(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function fmtDate(v) {
    if (!v) return '';
    return new Date(ts(v)).toLocaleDateString('en-GB', {
      day: 'numeric', month: 'short', year: 'numeric'
    });
  }

  let currentDocs = [];

  function renderList() {
    const list = document.getElementById('list');

    if (!currentDocs.length) {
      list.innerHTML = '<div class="ml-empty">You have not submitted any lores yet.<br>Click SUBMIT A LORE to write your first one.</div>';
      return;
    }

    list.innerHTML = '';
    currentDocs.forEach(doc => {
      const data = doc.data();
      const status = (data.status || 'pending').toLowerCase();

      const card = document.createElement('div');
      card.className = 'ml-card ' + status;

      // Tiles title
      const tiles = document.createElement('div');
      tiles.className = 'ml-tiles';
      renderTilesInto(tiles, data.title || 'Untitled', 12, 22);
      card.appendChild(tiles);

      // Meta row: date + reading time + status badge
      const meta = document.createElement('div');
      meta.className = 'ml-meta';
      const dateStr = fmtDate(data.createdAt);
      let metaHTML = '';
      if (dateStr) metaHTML += '<span>' + dateStr + '</span>';
      if (typeof data.readingTime === 'number' && data.readingTime > 0) {
        metaHTML += (metaHTML ? '<span class="dot"></span>' : '') + '<span>' + data.readingTime + ' min read</span>';
      }
      metaHTML += (metaHTML ? '<span class="dot"></span>' : '') + '<span class="ml-status ' + status + '">' + status + '</span>';
      meta.innerHTML = metaHTML;
      card.appendChild(meta);

      // Blurb
      if (data.blurb) {
        const blurb = document.createElement('div');
        blurb.className = 'ml-blurb';
        blurb.textContent = data.blurb;
        card.appendChild(blurb);
      }

      // Actions: open + delete
      const actions = document.createElement('div');
      actions.className = 'ml-actions';

      const openLink = document.createElement('a');
      openLink.className = 'ml-open';
      openLink.href = 'read.html?id=' + encodeURIComponent(doc.id);
      openLink.textContent = 'OPEN \u2192';
      actions.appendChild(openLink);

      const del = document.createElement('button');
      del.className = 'ml-delete';
      del.textContent = 'DELETE';
      del.addEventListener('click', () => handleDelete(doc.id, del));
      actions.appendChild(del);

      card.appendChild(actions);
      list.appendChild(card);
    });
  }

  async function handleDelete(id, btn) {
    if (!confirm('Delete this lore permanently? This cannot be undone.')) return;
    btn.disabled = true;
    btn.textContent = 'Deleting...';
    try {
      await db.collection('lores').doc(id).delete();
      currentDocs = currentDocs.filter(d => d.id !== id);
      renderList();
    } catch (e) {
      console.error('Delete failed:', e);
      btn.disabled = false;
      btn.textContent = 'DELETE';
      alert('Could not delete. See console.');
    }
  }

  async function loadMine(uid) {
    const list = document.getElementById('list');
    list.innerHTML = '<div class="ml-empty">Loading your lores...</div>';
    try {
      const snap = await db.collection('lores')
        .where('authorId', '==', uid)
        .get();

      currentDocs = snap.docs.map(d => ({ id: d.id, data: () => d.data() }));
      currentDocs.sort((a, b) => ts(b.data().createdAt) - ts(a.data().createdAt));
      renderList();
    } catch (e) {
      console.error('Load failed:', e);
      list.innerHTML = '<div class="ml-empty">Could not load your lores. Check console.</div>';
    }
  }

  firebase.auth().onAuthStateChanged(user => {
    const gate = document.getElementById('gate');
    const list = document.getElementById('list');

    if (user) {
      gate.style.display = 'none';
      list.style.display = 'flex';
      loadMine(user.uid);
    } else {
      list.style.display = 'none';
      gate.innerHTML = 'You need to sign in to see your lores.<br>Click <strong>Sign In</strong> in the top right.';
    }
  });
</script>
</body>
