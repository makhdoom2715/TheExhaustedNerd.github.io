<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where is Maya?</title>
<meta name="description" content="A math detective story. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f4ede4;
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    color: #2a2a2a;
  }

  .container {
    max-width: 800px;
    width: 100%;
    text-align: center;
    background: #fffaf3;
    border-radius: 30px;
    padding: 40px 30px 60px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
  }

  .header-image {
    width: 100%;
    max-width: 600px;
    border-radius: 20px;
    margin-bottom: 30px;
    border: 3px solid #2a2a2a;
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 48px;
    color: #2a2a2a;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 18px;
    color: #6b5e5a;
    margin-bottom: 30px;
    font-style: italic;
  }

  .description {
    font-size: 20px;
    line-height: 1.6;
    color: #4a3f3c;
    margin-bottom: 50px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }

  .coming-soon-wrapper {
    display: inline-block;
    position: relative;
    padding: 10px 30px;
  }

  .coming-soon-text {
    font-family: 'Fredoka One', cursive;
    font-size: 64px;
    color: #ffb000;
    text-shadow: 4px 4px 0 #2a2a2a;
    position: relative;
    display: inline-block;
    letter-spacing: 2px;
  }

  .coming-soon-text::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -10px;
    width: 100%;
    height: 6px;
    background: #2a2a2a;
    border-radius: 50%;
    animation: squiggle 2s infinite;
  }

  @keyframes squiggle {
    0% { transform: scaleX(1) rotate(0deg); }
    50% { transform: scaleX(1.1) rotate(2deg); }
    100% { transform: scaleX(1) rotate(0deg); }
  }

  @media (max-width: 600px) {
    .container {
      padding: 30px 20px 40px;
      border-radius: 20px;
    }
    h1 {
      font-size: 36px;
    }
    .coming-soon-text {
      font-size: 44px;
    }
    .description {
      font-size: 18px;
    }
    .header-image {
      border-width: 2px;
    }
  }
</style>
</head>
<body>

  <div class="container">
    <img src="assets/where-is-maya-header.jpg" alt="Where is Maya header" class="header-image">

    <h1>Where is Maya?</h1>
    <p class="subtitle">nothing unusual happened, officially</p>

    <p class="description">
      Maya Lin has been missing for 72 hours. All you have is her phone, and you're the only one who won't stop looking. Save her.
    </p>

    <div class="coming-soon-wrapper">
      <span class="coming-soon-text">COMING SOON</span>
    </div>
  </div>

</body>
</html>
