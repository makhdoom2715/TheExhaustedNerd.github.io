  .read-wrap {

  .read-tiles {

  .read-tiles .tile-word {

  }
  .read-tiles .tile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    border-radius: 2px;
    transition: transform 0.15s ease;
  }
  .read-tiles .tile:hover { transform: scale(1.05) !important; z-index: 2; }

  .read-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8b8b9a;
    letter-spacing: 0.05em;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .read-meta .dot {
    width: 3px;
    height: 3px;
    background: #55555f;
    border-radius: 50%;
  }
  .read-meta .tag {
    padding: 3px 8px;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 4px;
    font-size: 11px;
  }

  .read-body {
    color: #e6e6e6;
    font-family: 'W95FA', 'VT323', monospace;
    font-size: 17px;
    line-height: 1.9;
    letter-spacing: 0.02em;

  .read-body p { margin: 0 0 1.2em; }
  .read-body h2 {
    font-family: 'W95FA', 'VT323', monospace;
    font-size: 26px;
    line-height: 1.5;
    color: #e6e6e6;
    font-weight: 400;
    margin: 1.2em 0 0.6em;
  }
  .read-body blockquote {
    margin: 1.4em 0;

    color: #c8c8d2;

  .read-body img {
    display: block;
    width: 100%;
    max-width: 100%;

  .read-back {
    display: inline-block;
    margin-top: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;

  .read-back:hover { text-decoration: underline; }

  .read-state {

    padding: 80px 24px;
    font-family: 'JetBrains Mono', monospace;

    color: #8b8b9a;
    letter-spacing: 0.05em;
  }

  @media (max-width: 600px) {
    .read-page { padding: 32px 22px 32px; }
    .read-tiles { gap: 14px 0; }
    .read-tiles .tile-word { margin-right: 16px; }

<script>
  const TILE_COLORS = [
    '#5fa8d3', '#2d5a3d', '#6ba8c9', '#a8c96a',
    '#b3b94d', '#4a90a4', '#c4d68f', '#5a6b9a',
    '#2c4a6b', '#8db850', '#3d6b8e', '#4a6b9e'
  ];

  const TILE_FONTS = [
    { family: "'JetBrains Mono', monospace", weight: 500, style: 'normal' },
    { family: "'JetBrains Mono', monospace", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 500, style: 'italic' },
    { family: "Inter, sans-serif", weight: 900, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'italic' },
    { family: "Georgia, serif", weight: 700, style: 'normal' },
    { family: "'Times New Roman', serif", weight: 400, style: 'italic' },
    { family: "Garamond, Georgia, serif", weight: 500, style: 'normal' },
    { family: "'Courier New', monospace", weight: 700, style: 'normal' }
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function textColorFor(bg) {
    const r = parseInt(bg.slice(1, 3), 16);
    const g = parseInt(bg.slice(3, 5), 16);
    const b = parseInt(bg.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#0a0a0a' : '#f2f2f2';
  }

  function renderTilesInto(container, text) {
    if (!text || !text.trim()) { container.innerHTML = ''; return; }
    const words = text.split(' ').filter(w => w.length > 0);
    let html = '';
    words.forEach(word => {
      html += '<span class="tile-word">';
      for (const ch of word) {
        const bg = pick(TILE_COLORS);
        const fg = textColorFor(bg);
        const font = pick(TILE_FONTS);
        const size = 22 + Math.floor(Math.random() * 30);
        const padX = 8 + Math.floor(Math.random() * 16);
        const padY = 4 + Math.floor(Math.random() * 14);
        const dy = -10 + Math.floor(Math.random() * 21);
        const rot = -3 + Math.random() * 6;
        html += `<span class="tile" style="
          background:${bg};
          color:${fg};
          font-family:${font.family};
          font-weight:${font.weight};
          font-style:${font.style};
          font-size:${size}px;
          padding:${padY}px ${padX}px;
          transform: translateY(${dy}px) rotate(${rot}deg);
        ">${ch}</span>`;
      }
      html += '</span>';
    });
    container.innerHTML = html;
  }

  function ts(v) {
    if (!v) return 0;
    if (typeof v === 'number') return v;
    if (v.toMillis) return v.toMillis();
    return 0;
  }

  function escapeHTML(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function sanitizeBody(html) {
    // strip scripts and event handlers; keep p, h2, blockquote, img, br, strong, em
    const tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    tmp.querySelectorAll('script, style, iframe, object, embed').forEach(n => n.remove());
    tmp.querySelectorAll('*').forEach(el => {
      [...el.attributes].forEach(attr => {
        const name = attr.name.toLowerCase();
        if (name.startsWith('on')) el.removeAttribute(attr.name);
        if (name === 'href' && attr.value.trim().toLowerCase().startsWith('javascript:')) {
          el.removeAttribute('href');
        }
      });
    });
    return tmp.innerHTML;
  }

  function setState(msg) {
    const page = document.getElementById('readPage');
    page.innerHTML = '<div class="read-state">' + escapeHTML(msg) + '</div>';
  }

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) { setState('No lore specified.'); return; }

    try {
      const doc = await db.collection('lores').doc(id).get();
      if (!doc.exists) { setState('This lore does not exist.'); return; }

      const data = doc.data();
      const isAdmin = firebase.auth().currentUser &&
                      firebase.auth().currentUser.uid === 'XgBatcSvxPOUwOyuttyXJzdulw2';

      if (data.status !== 'approved' && !isAdmin) {
        setState('This lore is not available.');
        return;
      }

      document.title = (data.title || 'A Lore') + ' - The Exhausted Nerd';

      const page = document.getElementById('readPage');
      page.innerHTML = '';

      const tiles = document.createElement('div');
      tiles.className = 'read-tiles';
      renderTilesInto(tiles, data.title || 'Untitled');
      page.appendChild(tiles);

      const meta = document.createElement('div');
      meta.className = 'read-meta';

      const author = escapeHTML(data.author || 'Anonymous');
      let metaHTML = '<span>' + author + '</span>';

      if (data.createdAt) {
        const dateStr = new Date(ts(data.createdAt)).toLocaleDateString('en-GB', {
          day: 'numeric', month: 'short', year: 'numeric'
        });
        metaHTML += '<span class="dot"></span><span>' + dateStr + '</span>';
      }

      if (Array.isArray(data.tags) && data.tags.length) {
        data.tags.forEach(tag => {
          metaHTML += '<span class="tag">' + escapeHTML(tag) + '</span>';
        });
      }

      if (data.status !== 'approved') {
        metaHTML += '<span class="tag" style="border-color:#ffb000; color:#ffb000;">' + escapeHTML(data.status) + '</span>';
      }

      meta.innerHTML = metaHTML;
      page.appendChild(meta);

      const body = document.createElement('div');
      body.className = 'read-body';
      body.innerHTML = sanitizeBody(data.body || '');
      page.appendChild(body);

      const back = document.createElement('a');
      back.href = 'lores.html';
      back.className = 'read-back';
      back.textContent = '\u2190 BACK TO LORES';
      page.appendChild(back);

    } catch (e) {
      console.error('Read load failed:', e);
      setState('Could not load this lore.');
    }
  })();
</script>
