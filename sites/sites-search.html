<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse Search</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #64767d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 20px;
    color: #eaf3ee;
  }

  .logo {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #eaf3ee;
    margin-bottom: 4px;
    margin-top: 8px;
  }

  .logo span:nth-child(1) { color: #4a9dff; }
  .logo span:nth-child(2) { color: #4caf50; }
  .logo span:nth-child(3) { color: #ffb000; }
  .logo span:nth-child(4) { color: #e14b4b; }
  .logo span:nth-child(5) { color: #b28dff; }
  .logo span:nth-child(6) { color: #4caf50; }
  .logo span:nth-child(7) { color: #4a9dff; }

  .search-box {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 440px;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 22px;
    padding: 0 18px;
    margin-top: 20px;
    transition: box-shadow 0.2s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }

  .search-box:focus-within {
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }

  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    padding: 13px 0;
    background: transparent;
    color: #222;
    font-family: inherit;
  }

  .search-box input::placeholder {
    color: #9ca3af;
  }

  .recent-strip {
    margin-top: 28px;
    width: 100%;
    max-width: 440px;
    background: #4a5760;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  .recent-label {
    font-size: 10px;
    font-weight: 700;
    color: rgba(234, 243, 238, 0.55);
    letter-spacing: 0.14em;
    padding: 12px 16px 8px;
    text-transform: uppercase;
  }

  .recent-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    cursor: pointer;
    background: transparent;
    border-left: none;
    border-right: none;
    border-bottom: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    color: #eaf3ee;
    transition: background 0.15s ease;
  }

  .recent-item:last-child {
    padding-bottom: 14px;
  }

  .recent-item:hover,
  .recent-item:active {
    background: rgba(255, 255, 255, 0.05);
  }

  .recent-dot {
    flex-shrink: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00d4aa;
  }

  .recent-url {
    flex: 1;
    font-size: 13px;
    color: #eaf3ee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .recent-arrow {
    flex-shrink: 0;
    font-size: 16px;
    color: rgba(234, 243, 238, 0.35);
    font-weight: 300;
    line-height: 1;
  }
</style>
</head>
<body>

  <div class="logo">
    <span>S</span><span>y</span><span>n</span><span>a</span><span>p</span><span>s</span><span>e</span>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Type a URL..." autocomplete="off" spellcheck="false" autocapitalize="off">
  </div>

  <div class="recent-strip">
    <div class="recent-label">Recently Visited</div>

    <button class="recent-item" data-url="weatheruk.com">
      <span class="recent-dot"></span>
      <span class="recent-url">weatheruk.com</span>
      <span class="recent-arrow">›</span>
    </button>

    <button class="recent-item" data-url="findthecat.com">
      <span class="recent-dot"></span>
      <span class="recent-url">findthecat.com</span>
      <span class="recent-arrow">›</span>
    </button>

    <button class="recent-item" data-url="mikutap.com">
      <span class="recent-dot"></span>
      <span class="recent-url">mikutap.com</span>
      <span class="recent-arrow">›</span>
    </button>
  </div>

<script>
  var input = document.getElementById("searchInput");

  function navigate(url) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "browser-navigate", url: url }, "*");
    }
  }

  input.addEventListener("keydown", function(e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    var val = input.value.trim();
    if (!val) return;
    var cleaned = val.replace(/^https?:\/\//i, "").toLowerCase().replace(/\/+$/, "");
    navigate(cleaned);
  });

  var recentItems = document.querySelectorAll(".recent-item");
  for (var i = 0; i < recentItems.length; i++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        navigate(btn.getAttribute("data-url"));
      });
    })(recentItems[i]);
  }
</script>

</body>
</html>
