<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;900&family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">

<style>
  .profile-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 48px;
  }

  /* ---------- Discord-style header card ---------- */
  .profile-card {
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    background: rgba(255,255,255,0.01);
    margin: 48px 0 28px;
    overflow: hidden;
  }

  .profile-banner {
    height: 110px;
    background:
      radial-gradient(circle at 15% 40%, rgba(255,176,0,0.5), transparent 55%),
      radial-gradient(circle at 85% 30%, rgba(0,212,170,0.45), transparent 55%),
      linear-gradient(135deg, #1a1a24 0%, #0f0f18 100%);
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .profile-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 20px 20px;
    opacity: 0.6;
  }

  .profile-identity {
    padding: 0 28px 24px;
    margin-top: -46px;
    position: relative;
  }

  .profile-avatar {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb000, #00d4aa);
    color: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 38px;
    font-weight: 700;
    text-transform: uppercase;
    border: 4px solid var(--bg);
    box-shadow: 0 0 0 1px rgba(255,176,0,0.4), 0 0 24px rgba(255,176,0,0.15);
  }

  .profile-name {
    font-family: var(--font-display);
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 14px 0 6px;
    color: var(--text);
  }

  .profile-subline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8b8b9a;
    letter-spacing: 0.05em;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .profile-subline .dot {
    width: 3px;
    height: 3px;
    background: #55555f;
    border-radius: 50%;
  }

  .profile-bio {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: #c8c8d2;
    line-height: 1.7;
    white-space: pre-wrap;
    margin: 18px 0 0;
    padding: 14px 16px;
    border-left: 2px solid rgba(255,176,0,0.4);
    background: rgba(255,176,0,0.03);
    border-radius: 0 6px 6px 0;
  }
  .profile-bio.empty {
    color: #55555f;
    font-style: italic;
    border-left-color: rgba(255,255,255,0.1);
    background: transparent;
  }

  .profile-socials {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .profile-social {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 7px 14px;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 20px;
    color: #8b8b9a;
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .profile-social:hover {
    text-decoration: none;
    transform: translateY(-1px);
  }
  .profile-social.instagram:hover { border-color: #e1306c; color: #e1306c; box-shadow: 0 0 14px rgba(225,48,108,0.25); }
  .profile-social.tiktok:hover    { border-color: #ff0050; color: #ff0050; box-shadow: 0 0 14px rgba(255,0,80,0.25); }
  .profile-social.youtube:hover   { border-color: #ff0000; color: #ff0000; box-shadow: 0 0 14px rgba(255,0,0,0.25); }
  .profile-social.substack:hover  { border-color: #ff6719; color: #ff6719; box-shadow: 0 0 14px rgba(255,103,25,0.25); }
  .profile-social.discord:hover   { border-color: #5865f2; color: #5865f2; box-shadow: 0 0 14px rgba(88,101,242,0.25); }
  .profile-social.website:hover   { border-color: #00d4aa; color: #00d4aa; box-shadow: 0 0 14px rgba(0,212,170,0.25); }

  /* ---------- Stat tiles (game style) ---------- */
  .profile-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 0 28px 24px;
  }
  .profile-stat {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 8px;
    padding: 14px 12px;
    text-align: center;
    transition: border-color 0.15s ease;
  }
  .profile-stat:hover { border-color: rgba(255,176,0,0.35); }
  .profile-stat-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .profile-stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #55555f;
    margin-top: 4px;
  }
  .profile-stat.lores .profile-stat-num { color: #ffb000; }
  .profile-stat.likes .profile-stat-num { color: #ff5d7a; }
  .profile-stat.streak .profile-stat-num { color: #ffd76b; }
  .profile-stat.score .profile-stat-num { color: #00d4aa; }

  /* ---------- Tag pills ---------- */
  .profile-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 28px 22px;
  }
  .profile-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 5px 11px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.16);
    color: #8b8b9a;
  }
  .profile-tag.life    { border-color: rgba(0,212,170,0.4); color: #00d4aa; }
  .profile-tag.nerdy   { border-color: rgba(255,176,0,0.4); color: #ffb000; }
  .profile-tag.stories { border-color: rgba(201,166,255,0.4); color: #c9a6ff; }

  /* ---------- Edit mode ---------- */
  .profile-edit-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.16);
    color: #8b8b9a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    margin: 0 28px 24px;
  }
  .profile-edit-btn:hover {
    border-color: #ffb000;
    color: #ffb000;
  }

  .profile-form {
    display: none;
    flex-direction: column;
    gap: 14px;
    padding: 20px 28px 24px;
    border-top: 1px solid rgba(255,255,255,0.08);
    background: rgba(0,0,0,0.15);
  }
  .profile-form.show { display: flex; }

  .profile-field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #55555f;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .profile-field input,
  .profile-field textarea {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.16);
    color: #e6e6e6;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.15s ease;
  }
  .profile-field input:focus,
  .profile-field textarea:focus { border-color: #ffb000; }
  .profile-field textarea {
    min-height: 70px;
    resize: vertical;
    font-family: 'Inter', sans-serif;
  }
  .profile-field .hint-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #55555f;
    letter-spacing: 0.05em;
    margin-top: 4px;
    text-align: right;
  }

  .profile-form-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .profile-save {
    background: rgba(255,176,0,0.08);
    border: 1px solid #ffb000;
    color: #ffb000;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .profile-save:hover { background: rgba(255,176,0,0.16); }
  .profile-save:disabled { opacity: 0.4; cursor: not-allowed; }
  .profile-cancel {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.16);
    color: #8b8b9a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .profile-cancel:hover { border-color: #ff4444; color: #ff4444; }
  .profile-form-msg {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: #8b8b9a;
  }
  .profile-form-msg.ok { color: #00d4aa; }
  .profile-form-msg.err { color: #ff6b6b; }

  /* ---------- Lores list ---------- */
  .profile-lores-head {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 28px 0 18px;
    color: var(--text);
  }
  .profile-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .lore-card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    border: 1px solid rgba(255,255,255,0.14);
    border-left: 3px solid #ffb000;
    border-radius: 10px;
    padding: 24px 26px 22px;
    background: rgba(255,255,255,0.01);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .lore-card:hover {
    border-color: rgba(255,176,0,0.55);
    border-left-color: #ffb000;
    background: rgba(255,255,255,0.02);
  }
  .lore-tiles {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 0;
    line-height: 1;
    pointer-events: none;
  }
  .lore-tiles .tile-word {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-right: 14px;
  }
  .lore-tiles .tile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    border-radius: 2px;
  }
  .lore-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8b8b9a;
    letter-spacing: 0.05em;
    pointer-events: none;
  }
  .lore-meta .dot {
    width: 3px;
    height: 3px;
    background: #55555f;
    border-radius: 50%;
  }
  .lore-blurb {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #a8a8b8;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    pointer-events: none;
  }
  .lore-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    margin-top: 4px;
    pointer-events: none;
  }
  .lore-stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8b8b9a;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .lore-stats .heart-icon { color: #ff5d7a; font-size: 13px; }
  .lore-read {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ffb000;
    letter-spacing: 0.08em;
  }
  .lore-card:hover .lore-read { text-decoration: underline; }

  .profile-state {
    text-align: center;
    padding: 80px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #8b8b9a;
    letter-spacing: 0.05em;
    line-height: 1.8;
  }
  .profile-empty {
    text-align: center;
    padding: 40px 20px;
    color: #8b8b9a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 10px;
  }

  @media (max-width: 600px) {
    .profile-wrap { padding: 0 16px 32px; }
    .profile-card { margin: 28px 0 20px; }
    .profile-banner { height: 80px; }
    .profile-identity { padding: 0 20px 20px; margin-top: -38px; }
    .profile-avatar { width: 76px; height: 76px; font-size: 30px; }
    .profile-stats {
      grid-template-columns: repeat(2, 1fr);
      padding: 0 20px 20px;
    }
    .profile-tags { padding: 0 20px 18px; }
    .profile-edit-btn { margin: 0 20px 20px; }
    .profile-form { padding: 18px 20px 22px; }
    .lore-card { padding: 18px 18px 16px; }
  }
</style>

<script>
  const TILE_COLORS = [
    '#5fa8d3', '#2d5a3d', '#6ba8c9', '#a8c96a',
    '#b3b94d', '#4a90a4', '#c4d68f', '#5a6b9a',
    '#2c4a6b', '#8db850', '#3d6b8e', '#4a6b9e'
  ];

  const TILE_FONTS = [
    { family: "'JetBrains Mono', monospace", weight: 500, style: 'normal' },
    { family: "'JetBrains Mono', monospace", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 500, style: 'italic' },
    { family: "Inter, sans-serif", weight: 900, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'italic' },
    { family: "Georgia, serif", weight: 700, style: 'normal' },
    { family: "'Times New Roman', serif", weight: 400, style: 'italic' },
    { family: "Garamond, Georgia, serif", weight: 500, style: 'normal' },
    { family: "'Courier New', monospace", weight: 700, style: 'normal' }
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function textColorFor(bg) {
    const r = parseInt(bg.slice(1, 3), 16);
    const g = parseInt(bg.slice(3, 5), 16);
    const b = parseInt(bg.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#0a0a0a' : '#f2f2f2';
  }

  function renderTilesInto(container, text, minSize, maxSize) {
    if (!text || !text.trim()) { container.innerHTML = ''; return; }
    const words = text.split(' ').filter(w => w.length > 0);
    let html = '';
    words.forEach(word => {
      html += '<span class="tile-word">';
      for (const ch of word) {
        const bg = pick(TILE_COLORS);
        const fg = textColorFor(bg);
        const font = pick(TILE_FONTS);
        const size = minSize + Math.floor(Math.random() * (maxSize - minSize));
        const scale = minSize / 22;
        const padX = Math.round((8 + Math.floor(Math.random() * 16)) * scale);
        const padY = Math.round((4 + Math.floor(Math.random() * 14)) * scale);
        const dy = -6 + Math.floor(Math.random() * 13);
        const rot = -2 + Math.random() * 4;
        html += `<span class="tile" style="
          background:${bg};
          color:${fg};
          font-family:${font.family};
          font-weight:${font.weight};
          font-style:${font.style};
          font-size:${size}px;
          padding:${padY}px ${padX}px;
          transform: translateY(${dy}px) rotate(${rot}deg);
        ">${ch}</span>`;
      }
      html += '</span>';
    });
    container.innerHTML = html;
  }

  function ts(v) {
    if (!v) return 0;
    if (typeof v === 'number') return v;
    if (v.toMillis) return v.toMillis();
    return 0;
  }

  function fmtMonthYear(v) {
    if (!v) return '';
    return new Date(ts(v)).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
  }

  function escapeHTML(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function initialOf(name) {
    const n = (name || '?').trim();
    return n ? n[0].toUpperCase() : '?';
  }

  function setState(msg) {
    document.getElementById('profilePage').innerHTML =
      '<div class="profile-state">' + escapeHTML(msg) + '</div>';
  }

  // Build the social pill list from whatever the user saved
  function buildSocials(u) {
    const list = [];
    if (u.instagram) list.push({ key: 'instagram', label: 'Instagram', href: u.instagram });
    if (u.tiktok)    list.push({ key: 'tiktok',    label: 'TikTok',    href: u.tiktok });
    if (u.youtube)   list.push({ key: 'youtube',   label: 'YouTube',   href: u.youtube });
    if (u.substack)  list.push({ key: 'substack',  label: 'Substack',  href: u.substack });
    if (u.discord)   list.push({ key: 'discord',   label: 'Discord',   href: u.discord });
    if (u.website)   list.push({ key: 'website',   label: 'Website',   href: u.website });
    return list;
  }

  // Count how many lores have each tag
  function computeTagCounts(lores) {
    const counts = { Life: 0, Nerdy: 0, Stories: 0 };
    lores.forEach(l => {
      if (Array.isArray(l.tags)) {
        l.tags.forEach(t => {
          if (counts[t] !== undefined) counts[t] += 1;
        });
      }
    });
    return counts;
  }

  async function loadProfile(uid) {
    try {
      const [userDoc, loreSnap] = await Promise.all([
        db.collection('users').doc(uid).get(),
        db.collection('lores')
          .where('authorId', '==', uid)
          .where('status', '==', 'approved')
          .get()
      ]);

      const userData = userDoc.exists ? userDoc.data() : {};
      const lores = loreSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      lores.sort((a, b) => ts(b.createdAt) - ts(a.createdAt));

      const totalLikes = lores.reduce((sum, l) =>
        sum + (typeof l.likes === 'number' ? l.likes : 0), 0);

      const displayName = userData.name
        || (lores[0] && lores[0].author)
        || 'Anonymous';

      const joinedAt = userData.createdAt
        || (lores.length ? lores[lores.length - 1].createdAt : null);

      const currentUser = firebase.auth().currentUser;
      const isOwn = currentUser && currentUser.uid === uid;

      renderProfile(uid, displayName, userData, lores, totalLikes, joinedAt, isOwn);
    } catch (e) {
      console.error('Profile load failed:', e);
      setState('Could not load this profile.');
    }
  }

  function renderProfile(uid, displayName, userData, lores, totalLikes, joinedAt, isOwn) {
    const page = document.getElementById('profilePage');
    page.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'profile-card';

    // Banner
    const banner = document.createElement('div');
    banner.className = 'profile-banner';
    card.appendChild(banner);

    // Identity block
    const identity = document.createElement('div');
    identity.className = 'profile-identity';

    const avatar = document.createElement('div');
    avatar.className = 'profile-avatar';
    avatar.textContent = initialOf(displayName);
    identity.appendChild(avatar);

    const nameEl = document.createElement('h1');
    nameEl.className = 'profile-name';
    nameEl.textContent = displayName;
    identity.appendChild(nameEl);

    const subline = document.createElement('div');
    subline.className = 'profile-subline';
    const parts = [];
    parts.push('<span>' + lores.length + ' lore' + (lores.length === 1 ? '' : 's') + '</span>');
    if (joinedAt) parts.push('<span>joined ' + fmtMonthYear(joinedAt) + '</span>');
    subline.innerHTML = parts.join('<span class="dot"></span>');
    identity.appendChild(subline);

    // Bio
    const bioText = (userData.bio || '').trim();
    const bio = document.createElement('div');
    bio.className = 'profile-bio';
    if (bioText) {
      bio.textContent = bioText;
    } else {
      bio.classList.add('empty');
      bio.textContent = isOwn
        ? '> no bio yet. add one below._'
        : '> no bio yet._';
    }
    identity.appendChild(bio);

    // Socials
    const socials = buildSocials(userData);
    if (socials.length) {
      const socialWrap = document.createElement('div');
      socialWrap.className = 'profile-socials';
      socials.forEach(s => {
        const a = document.createElement('a');
        a.className = 'profile-social ' + s.key;
        a.href = s.href;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = s.label;
        socialWrap.appendChild(a);
      });
      identity.appendChild(socialWrap);
    }

    card.appendChild(identity);

    // Stat tiles
    const stats = document.createElement('div');
    stats.className = 'profile-stats';

    const totalScore = userData.score || 0;
    const streak = userData.streak || 0;

    stats.innerHTML =
      '<div class="profile-stat lores">' +
        '<div class="profile-stat-num">' + lores.length + '</div>' +
        '<div class="profile-stat-label">Lores</div>' +
      '</div>' +
      '<div class="profile-stat likes">' +
        '<div class="profile-stat-num">' + totalLikes + '</div>' +
        '<div class="profile-stat-label">Likes</div>' +
      '</div>' +
      '<div class="profile-stat streak">' +
        '<div class="profile-stat-num">' + streak + '</div>' +
        '<div class="profile-stat-label">Streak</div>' +
      '</div>' +
      '<div class="profile-stat score">' +
        '<div class="profile-stat-num">' + totalScore + '</div>' +
        '<div class="profile-stat-label">Score</div>' +
      '</div>';

    card.appendChild(stats);

    // Tag pills
    const tagCounts = computeTagCounts(lores);
    const tagBits = [];
    if (tagCounts.Life > 0)    tagBits.push('<span class="profile-tag life">Life \u00D7' + tagCounts.Life + '</span>');
    if (tagCounts.Nerdy > 0)   tagBits.push('<span class="profile-tag nerdy">Nerdy \u00D7' + tagCounts.Nerdy + '</span>');
    if (tagCounts.Stories > 0) tagBits.push('<span class="profile-tag stories">Stories \u00D7' + tagCounts.Stories + '</span>');
    if (tagBits.length) {
      const tagWrap = document.createElement('div');
      tagWrap.className = 'profile-tags';
      tagWrap.innerHTML = tagBits.join('');
      card.appendChild(tagWrap);
    }

    // Edit button + form (only for own profile)
    if (isOwn) {
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'profile-edit-btn';
      editBtn.textContent = (bioText || socials.length) ? 'EDIT PROFILE' : 'ADD BIO & LINKS';
      card.appendChild(editBtn);

      const form = document.createElement('div');
      form.className = 'profile-form';
      form.innerHTML =
        '<div class="profile-field">' +
          '<label>Bio</label>' +
          '<textarea id="editBio" maxlength="160" placeholder="One line about you..."></textarea>' +
          '<div class="hint-count"><span id="bioCount">0</span>/160</div>' +
        '</div>' +
        '<div class="profile-field">' +
          '<label>Instagram URL</label>' +
          '<input id="editInstagram" type="url" placeholder="https://instagram.com/yourname">' +
        '</div>' +
        '<div class="profile-field">' +
          '<label>TikTok URL</label>' +
          '<input id="editTiktok" type="url" placeholder="https://tiktok.com/@yourname">' +
        '</div>' +
        '<div class="profile-field">' +
          '<label>YouTube URL</label>' +
          '<input id="editYoutube" type="url" placeholder="https://youtube.com/@yourname">' +
        '</div>' +
        '<div class="profile-field">' +
          '<label>Substack URL</label>' +
          '<input id="editSubstack" type="url" placeholder="https://yourname.substack.com">' +
        '</div>' +
        '<div class="profile-field">' +
          '<label>Discord invite URL</label>' +
          '<input id="editDiscord" type="url" placeholder="https://discord.gg/...">' +
        '</div>' +
        '<div class="profile-field">' +
          '<label>Website</label>' +
          '<input id="editWebsite" type="url" placeholder="https://...">' +
        '</div>' +
        '<div class="profile-form-actions">' +
          '<button type="button" class="profile-save" id="editSave">SAVE</button>' +
          '<button type="button" class="profile-cancel" id="editCancel">CANCEL</button>' +
          '<span class="profile-form-msg" id="editMsg"></span>' +
        '</div>';
      card.appendChild(form);

      // Pre-fill inputs after insertion
      setTimeout(() => {
        document.getElementById('editBio').value = userData.bio || '';
        document.getElementById('editInstagram').value = userData.instagram || '';
        document.getElementById('editTiktok').value = userData.tiktok || '';
        document.getElementById('editYoutube').value = userData.youtube || '';
        document.getElementById('editSubstack').value = userData.substack || '';
        document.getElementById('editDiscord').value = userData.discord || '';
        document.getElementById('editWebsite').value = userData.website || '';
        updateBioCount();
      }, 0);

      function updateBioCount() {
        const el = document.getElementById('bioCount');
        const val = document.getElementById('editBio').value || '';
        if (el) el.textContent = val.length;
      }
      setTimeout(() => {
        const bioEl = document.getElementById('editBio');
        if (bioEl) bioEl.addEventListener('input', updateBioCount);
      }, 0);

      editBtn.addEventListener('click', () => {
        form.classList.toggle('show');
        if (form.classList.contains('show')) {
          editBtn.textContent = 'CANCEL EDIT';
        } else {
          editBtn.textContent = 'EDIT PROFILE';
        }
      });
      document.getElementById('editCancel').addEventListener('click', () => {
        form.classList.remove('show');
        editBtn.textContent = 'EDIT PROFILE';
      });

      document.getElementById('editSave').addEventListener('click', async () => {
        const saveBtn = document.getElementById('editSave');
        const msg = document.getElementById('editMsg');
        msg.className = 'profile-form-msg';
        msg.textContent = '';

        const updates = {
          bio:       document.getElementById('editBio').value.trim(),
          instagram: document.getElementById('editInstagram').value.trim(),
          tiktok:    document.getElementById('editTiktok').value.trim(),
          youtube:   document.getElementById('editYoutube').value.trim(),
          substack:  document.getElementById('editSubstack').value.trim(),
          discord:   document.getElementById('editDiscord').value.trim(),
          website:   document.getElementById('editWebsite').value.trim()
        };

        saveBtn.disabled = true;
        msg.textContent = 'Saving...';

        try {
          await db.collection('users').doc(uid).set(updates, { merge: true });
          msg.className = 'profile-form-msg ok';
          msg.textContent = 'Saved.';
          setTimeout(() => loadProfile(uid), 500);
        } catch (e) {
          console.error('Save failed:', e);
          msg.className = 'profile-form-msg err';
          msg.textContent = 'Could not save. Try again.';
          saveBtn.disabled = false;
        }
      });
    }

    page.appendChild(card);

    // Lores heading
    const head = document.createElement('h2');
    head.className = 'profile-lores-head';
    head.textContent = isOwn ? 'Your lores' : 'Lores by ' + displayName;
    page.appendChild(head);

    // Lores list
    const list = document.createElement('div');
    list.className = 'profile-list';
    page.appendChild(list);

    if (!lores.length) {
      list.innerHTML = '<div class="profile-empty">No published lores yet.</div>';
      return;
    }

    lores.forEach(lore => {
      const lc = document.createElement('div');
      lc.className = 'lore-card';
      lc.addEventListener('click', () => {
        window.location.href = 'read.html?id=' + encodeURIComponent(lore.id);
      });

      const tiles = document.createElement('div');
      tiles.className = 'lore-tiles';
      renderTilesInto(tiles, lore.title || 'Untitled', 14, 26);
      lc.appendChild(tiles);

      const lmeta = document.createElement('div');
      lmeta.className = 'lore-meta';
      let lmetaHTML = '';
      const dateStr = fmtMonthYear(lore.createdAt);
      if (dateStr) lmetaHTML += '<span>' + dateStr + '</span>';
      if (typeof lore.readingTime === 'number' && lore.readingTime > 0) {
        lmetaHTML += (lmetaHTML ? '<span class="dot"></span>' : '') +
          '<span>' + lore.readingTime + ' min read</span>';
      }
      lmeta.innerHTML = lmetaHTML;
      lc.appendChild(lmeta);

      if (lore.blurb) {
        const blurb = document.createElement('div');
        blurb.className = 'lore-blurb';
        blurb.textContent = lore.blurb;
        lc.appendChild(blurb);
      }

      const lfooter = document.createElement('div');
      lfooter.className = 'lore-footer';

      const statsEl = document.createElement('span');
      statsEl.className = 'lore-stats';
      const lc_likes = typeof lore.likes === 'number' ? lore.likes : 0;
      statsEl.innerHTML = '<span class="heart-icon">\u2665</span><span>' + lc_likes + '</span>';
      lfooter.appendChild(statsEl);

      const read = document.createElement('span');
      read.className = 'lore-read';
      read.textContent = 'READ \u2192';
      lfooter.appendChild(read);

      lc.appendChild(lfooter);
      list.appendChild(lc);
    });
  }

  let fired = false;
  firebase.auth().onAuthStateChanged(() => {
    if (fired) return;
    fired = true;

    const params = new URLSearchParams(window.location.search);
    const uid = params.get('id');
    if (!uid) { setState('No user specified.'); return; }
    loadProfile(uid);
  });
</script>
</body>
</html>
