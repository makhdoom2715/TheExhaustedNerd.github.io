<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lores - The Exhausted Nerd</title>
<meta name="description" content="Short writing by students. Anything goes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .lores-wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  .lores-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin: 48px 0 28px;
    padding: 0 24px;
  }
  .lores-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text);
  }
  .header-btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .header-btn {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 12px 22px;
    border: 1px solid #ffb000;
    color: #ffb000;
    background: rgba(255,176,0,0.08);
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .header-btn:hover {
    background: rgba(255,176,0,0.16);
    text-decoration: none;
  }
  .header-btn.ghost {
    border-color: rgba(255,255,255,0.16);
    color: #8b8b9a;
    background: transparent;
  }
  .header-btn.ghost:hover {
    border-color: #ffb000;
    color: #ffb000;
  }

  .lores-filters {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding: 0 24px 28px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .lores-filters::-webkit-scrollbar{ display: none; }
  .filter-pill {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.16);
    color: #8b8b9a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.05em;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .filter-pill:hover {
    border-color: #ffb000;
    color: #ffb000;
  }
  .filter-pill.active {
    border-color: #ffb000;
    color: #ffb000;
    background: rgba(255,176,0,0.08);
  }

  .lores-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 0 24px 48px;
  }

  /* Card is now a div, not an <a> */
  .lore-card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    border: 1px solid rgba(255,255,255,0.14);
    border-left: 3px solid #ffb000;
    border-radius: 10px;
    padding: 24px 26px 22px;
    background: rgba(255,255,255,0.01);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
    cursor: pointer;
  }
  .lore-card:hover {
    border-color: rgba(255,176,0,0.55);
    border-left-color: #ffb000;
    background: rgba(255,255,255,0.02);
  }

  .lore-tiles {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 0;
    line-height: 1;
    pointer-events: none;
  }
  .lore-tiles .tile-word {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-right: 14px;
  }
  .lore-tiles .tile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    border-radius: 2px;
  }

  .lore-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8b8b9a;
    letter-spacing: 0.05em;
    pointer-events: none;
  }
  .lore-meta .dot {
    width: 3px;
    height: 3px;
    background: #55555f;
    border-radius: 50%;
  }

  .lore-blurb {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #a8a8b8;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    pointer-events: none;
  }

  .lore-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
  }
  .lore-like-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid rgba(255,93,122,0.4);
    color: #ff5d7a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    z-index: 2;
  }
  .lore-like-btn:hover {
    border-color: #ff5d7a;
    background: rgba(255,93,122,0.08);
  }
  .lore-like-btn.liked {
    background: rgba(255,93,122,0.16);
    border-color: #ff5d7a;
  }
  .lore-like-btn .heart-icon {
    font-size: 13px;
  }
  .lore-like-btn .like-count {
    font-weight: 700;
  }

  .lore-read {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ffb000;
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  .lore-card:hover .lore-read {
    text-decoration: underline;
  }

  .lores-empty {
    text-align: center;
    padding: 60px 20px;
    color: #8b8b9a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 10px;
  }

  @media (max-width: 600px) {
    .lores-header {
      padding: 0 20px;
      margin: 32px 0 20px;
    }
    .lores-filters { padding: 0 20px 20px; }
    .lores-list { padding: 0 20px 32px; }
    .lore-card { padding: 18px 18px 16px; }
    .header-btn {
      font-size: 12px;
      padding: 10px 16px;
    }
  }
</style>
<!-- architect: 29 -->

<main>

      <h1 class="lores-title">Lores</h1>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>

<script>
  const TILE_COLORS = [
    '#5fa8d3', '#2d5a3d', '#6ba8c9', '#a8c96a',
    '#b3b94d', '#4a90a4', '#c4d68f', '#5a6b9a',
    '#2c4a6b', '#8db850', '#3d6b8e', '#4a6b9e'
  ];

  const TILE_FONTS = [
    { family: "'JetBrains Mono', monospace", weight: 500, style: 'normal' },
    { family: "'JetBrains Mono', monospace", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 500, style: 'italic' },
    { family: "Inter, sans-serif", weight: 900, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'italic' },
    { family: "Georgia, serif", weight: 700, style: 'normal' },
    { family: "'Times New Roman', serif", weight: 400, style: 'italic' },
    { family: "Garamond, Georgia, serif", weight: 500, style: 'normal' },
    { family: "'Courier New', monospace", weight: 700, style: 'normal' }
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function textColorFor(bg) {
    const r = parseInt(bg.slice(1, 3), 16);
    const g = parseInt(bg.slice(3, 5), 16);
    const b = parseInt(bg.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#0a0a0a' : '#f2f2f2';
  }

  function renderTilesInto(container, text, minSize, maxSize) {
    if (!text || !text.trim()) { container.innerHTML = ''; return; }
    const words = text.split(' ').filter(w => w.length > 0);
    let html = '';
    words.forEach(word => {
      html += '<span class="tile-word">';
      for (const ch of word) {
        const bg = pick(TILE_COLORS);
        const fg = textColorFor(bg);
        const font = pick(TILE_FONTS);
        const size = minSize + Math.floor(Math.random() * (maxSize - minSize));
        const scale = minSize / 22;
        const padX = Math.round((8 + Math.floor(Math.random() * 16)) * scale);
        const padY = Math.round((4 + Math.floor(Math.random() * 14)) * scale);
        const dy = -6 + Math.floor(Math.random() * 13);
        const rot = -2 + Math.random() * 4;
        html += `<span class="tile" style="
          background:${bg};
          color:${fg};
          font-family:${font.family};
          font-weight:${font.weight};
          font-style:${font.style};
          font-size:${size}px;
          padding:${padY}px ${padX}px;
          transform: translateY(${dy}px) rotate(${rot}deg);
        ">${ch}</span>`;
      }
      html += '</span>';
    });
    container.innerHTML = html;
  }

  function ts(v) {
    if (!v) return 0;
    if (typeof v === 'number') return v;
    if (v.toMillis) return v.toMillis();
    return 0;
  }

  function fmtDate(v) {
    if (!v) return '';
    return new Date(ts(v)).toLocaleDateString('en-GB', {
      day: 'numeric', month: 'short', year: 'numeric'
    });
  }

  function escapeHTML(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  let allDocs = [];
  let activeTag = 'All';
  let currentUid = null;
  const likedSet = new Set();

  function renderList() {
    const list = document.getElementById('loresList');

    const filtered = activeTag === 'All'
      ? allDocs
      : allDocs.filter(d => {
          const tags = d.tags || [];
          return Array.isArray(tags) && tags.includes(activeTag);
        });

    if (!filtered.length) {
      list.innerHTML = '<div class="lores-empty">' +
        (activeTag === 'All'
          ? 'No lores yet. Be the first to submit.'
          : 'No lores tagged "' + escapeHTML(activeTag) + '" yet.') +
        '</div>';
      return;
    }

    list.innerHTML = '';
    filtered.forEach(lore => {
      const card = document.createElement('div');
      card.className = 'lore-card';

      // Navigate on click, unless the click came from a button inside the card
      card.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        window.location.href = 'read.html?id=' + encodeURIComponent(lore.id);
      });

      const tiles = document.createElement('div');
      tiles.className = 'lore-tiles';
      renderTilesInto(tiles, lore.title || 'Untitled', 14, 26);
      card.appendChild(tiles);

      const meta = document.createElement('div');
      meta.className = 'lore-meta';
      const author = escapeHTML(lore.author || 'Anonymous');
      let metaHTML = '<span>' + author + '</span>';
      const dateStr = fmtDate(lore.createdAt);
      if (dateStr) metaHTML += '<span class="dot"></span><span>' + dateStr + '</span>';
      if (typeof lore.readingTime === 'number' && lore.readingTime > 0) {
        metaHTML += '<span class="dot"></span><span>' + lore.readingTime + ' min read</span>';
      }
      meta.innerHTML = metaHTML;
      card.appendChild(meta);

      if (lore.blurb) {
        const blurb = document.createElement('div');
        blurb.className = 'lore-blurb';
        blurb.textContent = lore.blurb;
        card.appendChild(blurb);
      }

      const footer = document.createElement('div');
      footer.className = 'lore-footer';

      const likeBtn = document.createElement('button');
      likeBtn.type = 'button';
      likeBtn.className = 'lore-like-btn';
      const likeCount = typeof lore.likes === 'number' ? lore.likes : 0;
      likeBtn.innerHTML = '<span class="heart-icon">\u2665</span><span class="like-count">' + likeCount + '</span>';
      if (likedSet.has(lore.id)) likeBtn.classList.add('liked');

      likeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleLike(lore.id, likeBtn);
      });

      footer.appendChild(likeBtn);

      const read = document.createElement('span');
      read.className = 'lore-read';
      read.textContent = 'READ \u2192';
      footer.appendChild(read);

      card.appendChild(footer);
      list.appendChild(card);
    });
  }

  async function toggleLike(loreId, btn) {
    if (!currentUid) {
      alert('Sign in to like lores.');
      return;
    }

    const countEl = btn.querySelector('.like-count');
    const wasLiked = likedSet.has(loreId);
    const currentCount = parseInt(countEl.textContent, 10) || 0;

    // Optimistic update: change UI immediately
    if (wasLiked) {
      likedSet.delete(loreId);
      btn.classList.remove('liked');
      countEl.textContent = Math.max(0, currentCount - 1);
    } else {
      likedSet.add(loreId);
      btn.classList.add('liked');
      countEl.textContent = currentCount + 1;
    }

    // Fire the Firestore write in the background
    const loreRef = db.collection('lores').doc(loreId);
    const likeRef = loreRef.collection('likes').doc(currentUid);

    try {
      if (wasLiked) {
        await likeRef.delete();
        await loreRef.update({ likes: firebase.firestore.FieldValue.increment(-1) });
      } else {
        await likeRef.set({ likedAt: firebase.firestore.FieldValue.serverTimestamp() });
        await loreRef.update({ likes: firebase.firestore.FieldValue.increment(1) });
      }
    } catch (e) {
      console.error('Like toggle failed:', e);
      // Revert optimistic UI on error
      if (wasLiked) {
        likedSet.add(loreId);
        btn.classList.add('liked');
        countEl.textContent = currentCount;
      } else {
        likedSet.delete(loreId);
        btn.classList.remove('liked');
        countEl.textContent = currentCount;
      }
      alert('Could not update like. Try again.');
    }
  }

  async function loadUserLikes() {
    if (!currentUid || !allDocs.length) return;
    try {
      const checks = allDocs.map(lore =>
        db.collection('lores').doc(lore.id).collection('likes').doc(currentUid).get()
          .then(doc => ({ id: lore.id, exists: doc.exists }))
          .catch(() => ({ id: lore.id, exists: false }))
      );
      const results = await Promise.all(checks);
      results.forEach(r => {
        if (r.exists) likedSet.add(r.id);
      });
      renderList();
    } catch (e) {
      console.error('User likes load failed:', e);
    }
  }

  document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeTag = pill.dataset.tag;
      renderList();
    });
  });

  async function loadLores() {
    const list = document.getElementById('loresList');
    try {
      const snap = await db.collection('lores')
        .where('status', '==', 'approved')
        .get();

      if (snap.empty) {
        allDocs = [];
        renderList();
        return;
      }

      allDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      allDocs.sort((a, b) => ts(b.createdAt) - ts(a.createdAt));
      renderList();

      if (currentUid) loadUserLikes();
    } catch (e) {
      console.error('Lores load failed:', e);
      list.innerHTML = '<div class="lores-empty">Could not load lores. Try again.</div>';
    }
  }

  let fired = false;
  firebase.auth().onAuthStateChanged(user => {
    currentUid = user ? user.uid : null;
    if (fired) {
      likedSet.clear();
      if (currentUid) loadUserLikes();
      else renderList();
      return;
    }
    fired = true;
    loadLores();
  });
</script>
</body>
