<style>
  .lores-actions {
    display: flex;
    justify-content: center;
    margin: 32px 0 48px;
  }
  .lores-submit {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 12px 22px;
    border: 1px solid #ffb000;
    color: #ffb000;
    background: rgba(255,176,0,0.08);
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .lores-submit:hover {
    background: rgba(255,176,0,0.16);
  }

  .lores-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  .lore-card {
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    padding: 26px 24px 22px;
    background: rgba(255,255,255,0.01);
    display: flex;
    flex-direction: column;
    gap: 18px;
    transition: border-color 0.15s ease;
    text-decoration: none;
    color: inherit;
  }
  .lore-card:hover {
    border-color: rgba(255,176,0,0.55);
  }

  .lore-tiles {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 0;
    line-height: 1;
  }
  .lore-tiles .tile-word {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-right: 14px;
  }
  .lore-tiles .tile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    border-radius: 2px;
  }

  .lore-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8b8b9a;
    letter-spacing: 0.05em;
  }
  .lore-meta .dot {
    width: 3px;
    height: 3px;
    background: #55555f;
    border-radius: 50%;
  }

  .lore-blurb {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #a8a8b8;
    line-height: 1.6;
    flex: 1;
  }

  .lore-read {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ffb000;
    letter-spacing: 0.08em;
    align-self: flex-start;
  }
  .lore-card:hover .lore-read {
    text-decoration: underline;
  }

  .lores-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: #8b8b9a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 10px;
  }

  @media (max-width: 600px) {
    .lores-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
  const TILE_COLORS = [
    '#5fa8d3', '#2d5a3d', '#6ba8c9', '#a8c96a',
    '#b3b94d', '#4a90a4', '#c4d68f', '#5a6b9a',
    '#2c4a6b', '#8db850', '#3d6b8e', '#4a6b9e'
  ];

  const TILE_FONTS = [
    { family: "'JetBrains Mono', monospace", weight: 500, style: 'normal' },
    { family: "'JetBrains Mono', monospace", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 700, style: 'normal' },
    { family: "'Space Grotesk', sans-serif", weight: 500, style: 'italic' },
    { family: "Inter, sans-serif", weight: 900, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'normal' },
    { family: "Georgia, serif", weight: 400, style: 'italic' },
    { family: "Georgia, serif", weight: 700, style: 'normal' },
    { family: "'Times New Roman', serif", weight: 400, style: 'italic' },
    { family: "Garamond, Georgia, serif", weight: 500, style: 'normal' },
    { family: "'Courier New', monospace", weight: 700, style: 'normal' }
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function textColorFor(bg) {
    const r = parseInt(bg.slice(1, 3), 16);
    const g = parseInt(bg.slice(3, 5), 16);
    const b = parseInt(bg.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#0a0a0a' : '#f2f2f2';
  }

  function renderTilesInto(container, text, minSize, maxSize) {
    if (!text || !text.trim()) { container.innerHTML = ''; return; }
    const words = text.split(' ').filter(w => w.length > 0);
    let html = '';
    words.forEach(word => {
      html += '<span class="tile-word">';
      for (const ch of word) {
        const bg = pick(TILE_COLORS);
        const fg = textColorFor(bg);
        const font = pick(TILE_FONTS);
        const size = minSize + Math.floor(Math.random() * (maxSize - minSize));
        const scale = minSize / 22;
        const padX = Math.round((8 + Math.floor(Math.random() * 16)) * scale);
        const padY = Math.round((4 + Math.floor(Math.random() * 14)) * scale);
        const dy = -10 + Math.floor(Math.random() * 21);
        const rot = -3 + Math.random() * 6;
        html += `<span class="tile" style="
          background:${bg};
          color:${fg};
          font-family:${font.family};
          font-weight:${font.weight};
          font-style:${font.style};
          font-size:${size}px;
          padding:${padY}px ${padX}px;
          transform: translateY(${dy}px) rotate(${rot}deg);
        ">${ch}</span>`;
      }
      html += '</span>';
    });
    container.innerHTML = html;
  }

  function ts(v) {
    if (!v) return 0;
    if (typeof v === 'number') return v;
    if (v.toMillis) return v.toMillis();
    return 0;
  }

  function escapeHTML(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  (async () => {
    const grid = document.getElementById('loresGrid');
    try {
      const snap = await db.collection('lores')
        .where('status', '==', 'approved')
        .get();

      if (snap.empty) {
        grid.innerHTML = '<div class="lores-empty">No lores yet. Be the first to submit.</div>';
        return;
      }

      const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      docs.sort((a, b) => ts(b.createdAt) - ts(a.createdAt));

      grid.innerHTML = '';
      docs.forEach(lore => {
        const card = document.createElement('a');
        card.className = 'lore-card';
        card.href = 'read.html?id=' + encodeURIComponent(lore.id);

        const tiles = document.createElement('div');
        tiles.className = 'lore-tiles';
        renderTilesInto(tiles, lore.title || 'Untitled', 14, 28);
        card.appendChild(tiles);

        const meta = document.createElement('div');
        meta.className = 'lore-meta';
        const author = escapeHTML(lore.author || 'Anonymous');
        const dateStr = lore.createdAt
          ? new Date(ts(lore.createdAt)).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
          : '';
        meta.innerHTML = '<span>' + author + '</span>'
          + (dateStr ? '<span class="dot"></span><span>' + dateStr + '</span>' : '');
        card.appendChild(meta);

        const blurb = document.createElement('div');
        blurb.className = 'lore-blurb';
        blurb.textContent = lore.blurb || '';
        card.appendChild(blurb);

        const read = document.createElement('span');
        read.className = 'lore-read';
        read.textContent = 'READ \u2192';
        card.appendChild(read);

        grid.appendChild(card);
      });
    } catch (e) {
      console.error('Lores load failed:', e);
      grid.innerHTML = '<div class="lores-empty">Could not load lores. Try again.</div>';
    }
  })();
</script>
</body>
